name: rag-enterprise-knowledge-base

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - rag_network
  minio:
    # MinIO 已于 2025-10-15 停止在 Docker Hub / Quay.io 发布官方镜像，只能使用本地已有镜像
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: never
    container_name: rag-minio
    restart: unless-stopped

    command: ["server", "/data", "--console-address", ":9001"]

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请配置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?请配置 MINIO_SECRET_KEY}

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - rag_network
volumes:
  postgres_data:
    name: rag-postgres-data
  minio_data:
    name: rag-minio-data

networks:
  rag_network:
    name: rag-network
    driver: bridge